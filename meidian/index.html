<style>
:root{--bg:#f6f6f3;--ink:#171717;--muted:#777;--line:#ecece8;--red:#ff4d3d}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input{font:inherit}.app{max-width:520px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(92px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 2px 12px}.brand{font-size:30px;font-weight:850;letter-spacing:-2px}.brand small{display:block;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:0;margin-top:3px}.loc{font-size:12px;color:#666;background:white;border:1px solid var(--line);padding:8px 10px;border-radius:14px}.search{display:flex;gap:8px;background:white;border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:14px}.search input{width:100%;border:0;outline:0;background:transparent}.cats{display:flex;gap:9px;overflow:auto;padding:2px 0 14px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.cat{flex:none;border:1px solid var(--line);background:white;border-radius:999px;padding:9px 14px;font-size:13px}.cat.on{background:#171717;color:white;border-color:#171717}.hero{height:210px;border-radius:28px;overflow:hidden;position:relative;margin-bottom:22px;background:url('https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=1200&q=88') center/cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,8,3,.75),rgba(20,8,3,.12))}.hero div{position:absolute;z-index:2;left:20px;bottom:20px;color:white;width:65%}.hero h1{font-size:30px;line-height:1.04;margin:0 0 7px;letter-spacing:-1.3px}.hero p{font-size:13px;color:#eee;margin:0}.title{display:flex;justify-content:space-between;align-items:end;margin:0 2px 12px}.title h2{font-size:22px;margin:0}.title span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:white;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 5px 18px rgba(0,0,0,.035)}.pic{height:138px;position:relative;background:#ddd}.pic img{width:100%;height:100%;object-fit:cover}.tag{position:absolute;left:9px;top:9px;background:rgba(255,255,255,.94);padding:5px 7px;border-radius:9px;font-size:10px;font-weight:700}.info{padding:11px 12px 13px}.name{font-size:15px;font-weight:750}.desc{height:31px;font-size:11px;color:var(--muted);line-height:1.45;margin-top:4px}.row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.price{font-size:17px;font-weight:850}.price small{font-size:10px;color:var(--muted);font-weight:500}.plus{width:31px;height:31px;border:0;border-radius:50%;background:var(--red);color:white;font-size:21px}.nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);padding:10px 20px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);background:rgba(250,250,247,.9);backdrop-filter:blur(22px);border-top:1px solid rgba(0,0,0,.06)}.nav button{border:0;background:none;color:#888;font-size:11px;padding:6px}.nav b{display:block;font-size:17px;color:#333}.nav .on{color:#111;font-weight:750}.cart{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:76px;width:min(488px,calc(100% - 32px));background:#171717;color:white;border-radius:20px;padding:10px 12px 10px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 12px 32px rgba(0,0,0,.22)}.cart small{color:#aaa;margin-left:6px}.cart button{border:0;background:white;border-radius:14px;padding:10px 16px;font-weight:750}.overlay{position:fixed;z-index:50;inset:0;background:rgba(0,0,0,.28);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(520px,100%);background:white;border-radius:30px 30px 0 0;padding:12px 18px calc(24px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto}.handle{width:42px;height:5px;border-radius:8px;background:#ddd;margin:0 auto 14px}.sheet h3{font-size:24px;margin:4px 0 5px}.sub,.hint,.tiny{font-size:12px;color:var(--muted);line-height:1.5}.line{display:flex;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line)}.primary,.ghost{width:100%;border-radius:18px;padding:14px;font-weight:800;margin-top:10px}.primary{border:0;background:var(--red);color:white}.ghost{border:1px solid var(--line);background:white}.address{background:#f7f7f4;border-radius:18px;padding:14px;margin:14px 0}.order{padding:14px 2px 30px}.orderhead{background:#171717;color:white;border-radius:28px;padding:22px;margin-bottom:14px}.orderhead h2{font-size:28px;margin:0 0 6px}.orderhead p{margin:0;color:#bbb;font-size:13px}.map{height:220px;border-radius:26px;background:linear-gradient(145deg,#f1efe8,#e9e5dc);position:relative;overflow:hidden;border:1px solid #e5e0d4;margin:14px 0}.road{position:absolute;background:white;border-radius:999px}.a{width:115%;height:26px;left:-12%;top:48%;transform:rotate(-19deg)}.b{width:90%;height:20px;left:24%;top:27%;transform:rotate(54deg)}.node,.rider{position:absolute;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:white;box-shadow:0 7px 18px rgba(0,0,0,.12);z-index:3}.store{left:10%;top:18%}.home{right:9%;bottom:14%}.rider{left:22%;top:34%;background:var(--red);color:white;transition:all 1.1s cubic-bezier(.2,.8,.2,1)}.timeline,.box{background:white;border:1px solid var(--line);border-radius:24px;padding:15px 17px}.step{display:grid;grid-template-columns:16px 1fr;gap:10px;padding:9px 0;color:#aaa}.dot{width:10px;height:10px;border-radius:50%;background:#ddd;margin-top:4px}.step.on{color:#111;font-weight:700}.step.on .dot{background:var(--red);box-shadow:0 0 0 5px rgba(255,77,61,.12)}.reveal{text-align:center;background:white;border:1px solid var(--line);border-radius:30px;padding:26px 20px;margin-top:14px}.big{font-size:40px;font-weight:900;letter-spacing:-2px;margin:6px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.stat{background:#f5f5f2;border-radius:18px;padding:16px;text-align:left}.stat b{display:block;font-size:24px}.orders{display:flex;flex-direction:column;gap:10px}.ordercard{background:white;border:1px solid var(--line);border-radius:20px;padding:14px}.ordercard div{display:flex;justify-content:space-between;gap:8px}.empty{text-align:center;color:#888;padding:80px 20px}@media(min-width:521px){body{background:#e9e9e5}.app{background:var(--bg)}}
</style>
</head><body><main id="app"></main>
<script>
const $=s=>document.querySelector(s),money=n=>`¥${Number(n).toFixed(1).replace('.0','')}`,IMG='https://images.unsplash.com/';
const goods=[
['mala','外卖','麻辣烫自由选','红油、芝麻酱、脆豆皮，今晚就这一口',42,780,'photo-1569718212165-3a8278d5f624','月售 3241'],['fried','外卖','脆皮炸鸡双拼','刚出锅的脆皮声，配冰可乐',59,1260,'photo-1562967914-608f82629710','深夜爆单'],['burger','外卖','双层芝士牛肉堡','两层牛肉、融化芝士、酸黄瓜',38,920,'photo-1568901346375-23c9450c58cd','距你 1.4km'],['pizza','外卖','榴莲芝士披萨','薄脆边，拉丝很长，趁热最好',68,1180,'photo-1574071318508-1cdbab80d002','满 49 减 8'],['tea','奶茶','黑糖波波鲜奶','大杯、少冰、七分甜、加双份波波',23,520,'photo-1572490122747-3968b75cc699','猜你想喝'],['cake','零食','午夜巧克力蛋糕','浓巧、海盐、湿润绵密，一口停不下',35,680,'photo-1578985545062-69928b1d9587','今晚限定'],['headphone','数码','降噪头戴耳机','你已经看了三次，先假装拥有它',2299,0,'photo-1505740420928-5e560c06d30e','浏览 3 次'],['camera','数码','随身口袋相机','旅行前最容易冲动下单的那一种',3599,0,'photo-1502920917128-1aa500764cbd','库存紧张'],['shoe','衣物','复古慢跑鞋','今晚觉得它会改变整个衣柜',699,0,'photo-1542291026-7eec264c27ff','仅剩 2 件'],['course','课程','摄影构图大师课','先体验“买过了”的满足，再决定学不学',399,0,'photo-1452780212940-6f5c0d14d848','今晚特价']
].map(x=>({id:x[0],cat:x[1],name:x[2],desc:x[3],price:x[4],kcal:x[5],img:IMG+x[6]+'?auto=format&fit=crop&w=900&q=85',tag:x[7]}));
const S={cat:'推荐',page:'home',cart:[],orders:JSON.parse(localStorage.getItem('meidian.orders')||'[]')};const save=()=>localStorage.setItem('meidian.orders',JSON.stringify(S.orders));
function nav(){return `<nav class="nav">${[['home','⌂','首页'],['orders','▤','没点单'],['stats','◔','省下']].map(x=>`<button data-page="${x[0]}" class="${S.page===x[0]?'on':''}"><b>${x[1]}</b>${x[2]}</button>`).join('')}</nav>`}
function cards(list){return list.map(x=>`<article class="card"><div class="pic"><img src="${x.img}" loading="lazy"><span class="tag">${x.tag}</span></div><div class="info"><div class="name">${x.name}</div><div class="desc">${x.desc}</div><div class="row"><span class="price">${money(x.price)} <small>${x.kcal?'· '+x.kcal+' kcal':''}</small></span><button class="plus" data-add="${x.id}">+</button></div></div></article>`).join('')}
function home(){let list=S.cat==='推荐'?goods.slice(0,6):goods.filter(x=>x.cat===S.cat);return `<header class="top"><div class="brand">没点<small>想吃想买，先点一单</small></div><div class="loc">家 · 模拟配送</div></header><label class="search">⌕ <input id="search" placeholder="搜点现在很想要的……"></label><div class="cats">${['推荐','外卖','奶茶','零食','数码','衣物','课程'].map(c=>`<button class="cat ${S.cat===c?'on':''}" data-cat="${c}">${c}</button>`).join('')}</div><section class="hero"><div><h1>今晚馋的<br>都可以点。</h1><p>唯一的区别：它不会真的送来。</p></div></section><div class="title"><h2>${S.cat==='推荐'?'今晚很容易心动':'正在看 · '+S.cat}</h2><span>全程零支付</span></div><div class="grid" id="grid">${cards(list)}</div>`}
function total(){return S.orders.filter(o=>o.done).reduce((a,o)=>a+o.total,0)}
function orders(){return `<header class="top"><div class="brand">没点单<small>每一单都没有真正发生</small></div></header><div class="orders">${S.orders.length?S.orders.map(o=>`<div class="ordercard"><div><b>${o.items[0].name}${o.items.length>1?' 等 '+o.items.length+' 件':''}</b><b>${money(o.total)}</b></div><p class="tiny">${new Date(o.time).toLocaleString('zh-CN')} · ${o.done?'已完成模拟':'模拟中'}</p></div>`).join(''):'<div class="empty">今晚还没有“没点单”。</div>'}</div>`}
function stats(){let done=S.orders.filter(o=>o.done),k=done.reduce((a,o)=>a+o.items.reduce((s,x)=>s+(x.kcal||0)*x.qty,0),0);return `<header class="top"><div class="brand">省下<small>给冲动一个出口之后</small></div></header><div class="reveal"><div class="tiny">累计没花出去</div><div class="big">${money(total())}</div><div class="stats"><div class="stat"><b>${done.length}</b><span class="tiny">次完整模拟</span></div><div class="stat"><b>${k}</b><span class="tiny">kcal 没吃进去</span></div></div><p class="sub">这些数字不评价你，只记录有多少次“马上就要买”的瞬间，最后停在了屏幕里。</p></div>`}
function render(){let body=S.page==='home'?home():S.page==='orders'?orders():stats();$('#app').innerHTML=`<div class="app">${body}${nav()}${S.page==='home'&&S.cart.length?cartbar():''}</div>`;bind()}
function cartbar(){let n=S.cart.reduce((a,x)=>a+x.price*x.qty,0);return `<div class="cart"><b>${money(n)}<small>${S.cart.reduce((a,x)=>a+x.qty,0)} 件 · 不会扣款</small></b><button id="checkout">去结算</button></div>`}
function detail(id){let x=goods.find(g=>g.id===id);document.body.insertAdjacentHTML('beforeend',`<div class="overlay"><section class="sheet"><div class="handle"></div><h3>${x.name}</h3><p class="sub">${x.desc}</p><div class="line"><span>${x.kcal?'默认规格 · 可加料':'标准规格 · 模拟库存锁定'}</span><b>${money(x.price)}</b></div><p class="hint">这里不会发生真实购买。你会经历完整的“下单—等待—收到”，然后再看看自己还想不想要。</p><button class="primary" id="add">加入今晚这一单</button><button class="ghost" id="close">再看看</button></section></div>`);$('#close').onclick=()=>$('.overlay').remove();$('#add').onclick=()=>{let c=S.cart.find(i=>i.id===id);c?c.qty++:S.cart.push({...x,qty:1});$('.overlay').remove();render()}}
function checkout(){let sum=S.cart.reduce((a,x)=>a+x.price*x.qty,0),food=S.cart.some(x=>x.kcal);document.body.insertAdjacentHTML('beforeend',`<div class="overlay"><section class="sheet"><div class="handle"></div><h3>确认这一单</h3><p class="sub">看起来和真的一样，但不会扣一分钱。</p><div class="address"><b>${food?'送到：家 · 门口':'收货：家 · 模拟地址'}</b><div class="tiny">${food?'配送备注：放门口，不要敲门':'地址不会上传或保存'}</div></div>${S.cart.map(x=>`<div class="line"><span>${x.name} × ${x.qty}</span><b>${money(x.price*x.qty)}</b></div>`).join('')}<div class="line"><b>模拟合计</b><b>${money(sum)}</b></div><button class="primary" id="pay">${food?'模拟支付并呼叫骑手':'模拟支付并等待发货'}</button><button class="ghost" id="cancel">我现在已经不想要了</button></section></div>`);$('#cancel').onclick=()=>{$('.overlay').remove();S.cart=[];render()};$('#pay').onclick=()=>{let o={id:Date.now(),time:new Date().toISOString(),items:S.cart.map(x=>({...x})),total:sum,type:food?'delivery':'parcel',done:false};S.orders.unshift(o);save();S.cart=[];$('.overlay').remove();track(o)}}
function track(o){let steps=o.type==='delivery'?['商家已接单','餐品制作完成','骑手已取餐','距你 820 米','已送达 · 但门口什么也没有']:['下单成功','仓库已出库','运输至中转站','正在派送','已签收 · 但你没有真的买'],pos=[[22,34],[37,40],[50,49],[66,58],[77,66]],i=0;$('#app').innerHTML=`<div class="app"><div class="order"><div class="orderhead"><h2>${o.type==='delivery'?'骑手正在赶来':'包裹已经出发'}</h2><p id="st">${steps[0]}</p></div><div class="map"><div class="road a"></div><div class="road b"></div><div class="node store">${o.type==='delivery'?'店':'仓'}</div><div class="node home">家</div><div class="rider" id="rider">${o.type==='delivery'?'骑':'件'}</div></div><div class="timeline" id="tl"></div><div id="end"></div></div></div>`;function tick(){o.status=i;$('#st').textContent=steps[i];$('#tl').innerHTML=steps.map((s,j)=>`<div class="step ${j<=i?'on':''}"><span class="dot"></span><span>${s}</span></div>`).join('');let r=$('#rider');r.style.left=pos[i][0]+'%';r.style.top=pos[i][1]+'%';if(i<4){i++;setTimeout(tick,1600)}else setTimeout(()=>finish(o),800)}tick()}
function finish(o){o.done=true;save();let k=o.items.reduce((a,x)=>a+(x.kcal||0)*x.qty,0);$('#end').innerHTML=`<div class="reveal"><div class="tiny">这单已经“送到”了</div><div class="big">你留下了 ${money(o.total)}</div><p class="sub">${o.type==='delivery'?'以及大约 '+k+' kcal。<br>':''}刚才那一阵想要的感觉，也许已经过去了一点。</p><div class="stats"><div class="stat"><b>${money(total())}</b><span class="tiny">累计没花出去</span></div><div class="stat"><b>${S.orders.filter(x=>x.done).length}</b><span class="tiny">次冲动被完整体验</span></div></div><button class="primary" id="back">回首页</button><button class="ghost" id="still">我居然还是很想要</button></div>`;$('#back').onclick=()=>{S.page='home';render()};$('#still').onclick=()=>{alert('那就把它留到明天。真正想要的东西，明天通常还会想要。');S.page='home';render()}}
function bind(){document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{S.cat=b.dataset.cat;render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>detail(b.dataset.add));document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{S.page=b.dataset.page;render()});if($('#checkout'))$('#checkout').onclick=checkout;if($('#search'))$('#search').oninput=e=>{$('#grid').innerHTML=cards(goods.filter(x=>(x.name+x.desc+x.cat).includes(e.target.value.trim())));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>detail(b.dataset.add))}}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}));render();
</script></body></html>
